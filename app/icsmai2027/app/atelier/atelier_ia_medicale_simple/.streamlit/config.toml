# Configuration de l'application Streamlit de l'atelier (Streamlit Community Cloud lit ce fichier à la racine du dépôt).
# Sans effet sur le site Next.js.
[theme]
base = "light"
primaryColor = "#0E7C86"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F6F7"
textColor = "#1B2A35"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true

[browser]
gatherUsageStats = false
